<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script>
    // Redirect all 404s back to index.html preserving the path as a query param
    var seg = window.location.pathname.replace(/^\/snagpost-dashboard/, '') || '/';
    window.location.replace('/snagpost-dashboard/?r=' + encodeURIComponent(seg + window.location.search + window.location.hash));
  </script>
</head>
</html>
